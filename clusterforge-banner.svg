<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ClusterForge</title>
  <desc id="desc">Distributed work. Resilient execution. A network of workers connected to a central coordinator.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142334"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#243347" stroke-width="1" opacity=".45"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>
  <path d="M40 1H1160" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="54" y="51" width="267" height="30" rx="15" fill="#283022" stroke="#716132"/>
    <circle cx="72" cy="66" r="4" fill="#fbbf24"/>
    <text x="86" y="71" fill="#fde68a" font-size="12" font-weight="700" letter-spacing="1.8">DISTRIBUTED COMPUTING</text>
    <text x="51" y="163" fill="#f8fafc" font-size="68" font-weight="750" letter-spacing="-3">Cluster<tspan fill="#fbbf24">Forge</tspan></text>
    <text x="54" y="215" fill="#e2e8f0" font-size="27" font-weight="600">Distributed work.</text>
    <text x="54" y="252" fill="#e2e8f0" font-size="27" font-weight="600">Resilient execution.</text>
    <text x="54" y="301" fill="#a8b8cc" font-size="17">A worker may fail. The computation should continue.</text>
    <path d="M54 335H610" stroke="#304158"/>
    <text x="54" y="367" fill="#a7f3d0" font-size="12" letter-spacing="2" font-weight="600">PYTHON</text>
    <text x="150" y="367" fill="#a8b8cc" font-size="12" letter-spacing="2">/</text>
    <text x="177" y="367" fill="#a7f3d0" font-size="12" letter-spacing="2" font-weight="600">CLI FIRST</text>
    <text x="304" y="367" fill="#a8b8cc" font-size="12" letter-spacing="2">/</text>
    <text x="331" y="367" fill="#a7f3d0" font-size="12" letter-spacing="2" font-weight="600">FAULT TOLERANCE</text>
  </g>
  <g fill="none" stroke="#365269" stroke-width="2">
    <circle cx="932" cy="212" r="153" stroke-dasharray="4 10"/>
    <path d="M932 192V96M947 212H1084M932 232V329M916 212H779"/>
  </g>
  <g fill="#a7f3d0"><circle cx="932" cy="139" r="4"/><circle cx="1015" cy="212" r="4"/><circle cx="852" cy="212" r="4"/><circle cx="932" cy="287" r="4"/></g>
  <rect x="864" y="154" width="136" height="116" rx="22" fill="#292a23" stroke="#fbbf24" stroke-width="2"/>
  <path d="M910 181L932 169L954 181V205L932 218L910 205ZM910 181L932 194L954 181M932 194V218" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
  <text x="932" y="246" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="1">COORDINATOR</text>
  <g fill="#142c32" stroke="#548a82" stroke-width="1.5">
    <rect x="897" y="48" width="70" height="48" rx="12"/>
    <rect x="1084" y="188" width="70" height="48" rx="12"/>
    <rect x="897" y="329" width="70" height="48" rx="12"/>
    <rect x="709" y="188" width="70" height="48" rx="12"/>
